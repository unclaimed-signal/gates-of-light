    #sky::before{animation:depth-near 12.8s ease-in-out -4s infinite alternate,twinkle 3s ease-in-out -1s infinite alternate}
    #sky::after{background-size:112% 112%;animation:depth-far 20s ease-in-out -9.6s infinite alternate,twinkle 4.5s ease-in-out -2.4s infinite alternate;opacity:.3}
    .spark{position:absolute;left:var(--x);top:var(--y);width:2px;height:2px;border-radius:50%;background:#e6edff;box-shadow:0 0 7px 2px #8dacda66;pointer-events:none;animation:spark 3.4s ease-in-out var(--t) infinite alternate}
    .spark::after{content:'';position:absolute;inset:-4px;background:linear-gradient(transparent 44%,#c9e3ff66 49% 51%,transparent 56%),linear-gradient(90deg,transparent 44%,#c9e3ff66 49% 51%,transparent 56%);pointer-events:none}
    .spark:nth-of-type(3n){animation-duration:4.9s}.spark:nth-of-type(3n + 1){animation-duration:2.9s}
    @keyframes spark{from{opacity:.18;transform:scale(.6)}to{opacity:.95;transform:scale(1.25)}}
    .point{position:absolute;width:44px;height:44px;transform:translate(-50%,-50%);color:var(--light);background:transparent;outline-offset:5px;border-radius:50%;-webkit-tap-highlight-color:transparent}
    .point::before,.point::after{content:'';position:absolute;pointer-events:none}
    .point::before{width:5px;height:5px;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border-radius:50%;box-shadow:0 0 5px 2px var(--light),0 0 13px 4px var(--light);animation:breathe 4.8s ease-in-out infinite alternate}
    .point::after{inset:3px;background:radial-gradient(ellipse,currentColor,transparent 65%);opacity:.25;animation:halo 6.4s ease-in-out infinite alternate}
    .p1{left:17%;top:50%;--light:#ef394b;cursor:pointer}
    .p2{left:50%;top:17%;--light:#af67ff;cursor:pointer}
    .p3{left:83%;top:50%;--light:#ffd982;cursor:pointer}
    .p4{left:50%;top:83%;--light:#52df94}
    .p1::before{animation-duration:4.6s}.p2::before,.p2::after{animation-delay:-1.6s;animation-duration:7.2s}.p3::before{width:7px;height:7px;animation-delay:-3.2s}.p3::after{animation-delay:-2.4s;animation-duration:8.8s}.p4::before,.p4::after{animation-delay:-.8s;animation-duration:5.6s}
    #view{--image:url('./assets/sun.jpg');--rays:255,218,141;--halo:198,113,29}
    #view-2{--image:url('./assets/inferno.jpg');--rays:235,43,58;--halo:130,20,31}
    #view-3{--image:url('./assets/imagination.png');--rays:181,141,255;--halo:82,36,126}
    .art{position:fixed;inset:0;z-index:2;background:#000 var(--image) center/cover no-repeat;visibility:hidden;opacity:0;transition:opacity .6s ease,visibility .6s;cursor:default;overflow:hidden;-webkit-tap-highlight-color:transparent}
    .art:target{visibility:visible;opacity:1}
    .art-back{position:absolute;inset:0;z-index:1;cursor:default;-webkit-tap-highlight-color:transparent}
    .star-core{position:absolute;left:50%;top:50%;width:clamp(64px,24vmin,160px);height:clamp(64px,24vmin,160px);transform:translate(-50%,-50%);border-radius:50%;clip-path:circle(50%);z-index:3;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .star-core:focus-visible{outline:1px solid rgba(255,240,205,.6);outline-offset:-4px}
    .art::after{content:'';position:absolute;inset:-6%;pointer-events:none;opacity:.14;background:repeating-conic-gradient(from 12deg,transparent 0deg 9deg,rgba(var(--rays),.55) 12deg,transparent 16deg 31deg),radial-gradient(ellipse at center,transparent 24%,rgba(var(--halo),.28) 48%,transparent 73%);mask-image:radial-gradient(ellipse,transparent 15%,#000 38%,transparent 85%);animation:drift 14.4s ease-in-out -4s infinite alternate,corona 2.7s ease-in-out -.8s infinite alternate;animation-play-state:paused}
    .sky-wash{position:absolute;inset:-12px;pointer-events:none;background:url('./assets/starfield.svg') center/cover no-repeat;mix-blend-mode:screen;mask-image:radial-gradient(ellipse at center,transparent 25%,#000 65%);opacity:.7;animation:depth-far 16.8s ease-in-out -6.4s infinite alternate,twinkle 3.8s ease-in-out -1.6s infinite alternate;animation-play-state:paused}
    .art:target .sky-wash{animation-play-state:running}
    .art:target::after{animation-play-state:running}
    #view-2::after{animation-duration:19.2s,3.7s;animation-delay:-6.4s,-1.6s;opacity:.1}
    .comet{position:absolute;left:-15%;top:8%;width:clamp(60px,8vw,116px);height:2px;pointer-events:none;opacity:0;background:linear-gradient(90deg,transparent,#8ab7e94d 40%,#e6f5ff 100%);border-radius:100%;animation:comet-pass 28s linear infinite}
    .comet::after{content:'';position:absolute;right:0;top:-1px;width:4px;height:4px;border-radius:50%;background:#ecf9ff;box-shadow:0 0 6px 2px #b9dfff99;pointer-events:none}
    @keyframes comet-pass{0%,7%{opacity:0;transform:translate(-12vw,-8vh) rotate(20deg)}9%{opacity:.75;transform:translate(0,0) rotate(20deg)}17%{opacity:.65;transform:translate(90vw,30vh) rotate(20deg)}19%,100%{opacity:0;transform:translate(125vw,42vh) rotate(20deg)}}
    .art .comet{animation-play-state:paused}
    .art:target .comet{animation-play-state:running}
    body:has(.art:target) #sky>.comet{animation-play-state:paused}
    body:has(.art:target) .spark{animation-play-state:paused}
    body:has(.art:target) #sky::before,body:has(.art:target) #sky::after,body:has(.art:target) .point::before,body:has(.art:target) .point::after{animation-play-state:paused}
    @keyframes breathe{from{opacity:.66;transform:translate(-50%,-50%) scale(.94)}to{opacity:1;transform:translate(-50%,-50%) scale(1.04)}}
    @keyframes halo{from{opacity:.16;transform:scale(.85)}to{opacity:.34;transform:scale(1.12)}}
    @keyframes depth-near{from{transform:translate(-11px,7px)}to{transform:translate(11px,-7px)}}
    @keyframes depth-far{from{transform:translate(10px,-7px)}to{transform:translate(-10px,7px)}}
    @keyframes twinkle{from{opacity:.3}to{opacity:.85}}
    @keyframes drift{from{transform:rotate(-10deg) scale(1.01)}to{transform:rotate(10deg) scale(1.03)}}
    @keyframes corona{from{opacity:.1}to{opacity:.42}}
    @media(orientation:portrait){
      .art{background:radial-gradient(ellipse at center,rgba(var(--halo),.2),transparent 70%),#000 url('./assets/starfield.svg') center/cover no-repeat}
      .art::before{content:'';position:absolute;left:0;right:0;top:50%;height:54svh;transform:translateY(-50%);background:var(--image) center/auto 100% no-repeat;mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent);pointer-events:none}
    }
    @media(prefers-reduced-motion:reduce){#sky::before,#sky::after,.point::before,.point::after,.art::after,.spark,.sky-wash,.comet{animation:none}.comet{opacity:0}.art{transition:none}}
  </style>
</head>
